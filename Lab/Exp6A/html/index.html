<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx Docker Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: #cbd5e1;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            background-color: #22c55e;
            color: black;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome Kinjal 🚀</h1>
        <p>Your Nginx container is running successfully</p>
        <div class="status">Docker + Nginx Working 🎉</div>
    </div>

</body>

</html>
